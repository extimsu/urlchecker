name: chart

# The install test builds the image from the same commit, so code changes run
# it too.
on:
  pull_request:
  push:
    branches: [master]
    tags: [chart-v*]

permissions:
  contents: read

env:
  CHART: charts/urlchecker
  HELM_VERSION: v3.19.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          for f in "$CHART"/ci/*.yaml; do helm lint "$CHART" --strict -f "$f"; done
      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.0
          helm unittest "$CHART"
      - name: kubeconform
        run: |
          for f in "$CHART"/ci/*.yaml; do
            helm template t "$CHART" -f "$f" --set serviceMonitor.enabled=true --set podDisruptionBudget.enabled=true \
                --set prometheusRule.enabled=true --set grafanaDashboard.enabled=true \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done
      - name: dashboard JSON is up to date
        run: |
          python3 hack/gen-dashboard.py
          git diff --exit-code -- "$CHART/dashboards"
      - name: README is up to date (helm-docs)
        run: |
          docker run --rm -v "$PWD:/w" -w /w jnorwood/helm-docs:v1.14.2 --chart-search-root charts
          git diff --exit-code -- "$CHART/README.md"

  install:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [deployment, daemonset, discovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          config: ${{ matrix.mode == 'discovery' && '.github/kind-2-nodes.yaml' || '' }}
      - name: build the image from this commit
        run: |
          docker build -t ghcr.io/extimsu/urlchecker:ci .
          kind load docker-image ghcr.io/extimsu/urlchecker:ci --name chart-testing
      - name: install and helm test
        run: |
          ns=default
          if [ "${{ matrix.mode }}" = deployment ]; then
            # The Deployment must pass the restricted Pod Security Standard.
            ns=restricted
            kubectl create ns $ns
            kubectl label ns $ns pod-security.kubernetes.io/enforce=restricted
          fi
          helm install probe "$CHART" -n $ns -f "$CHART/ci/${{ matrix.mode }}-values.yaml" \
            --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 3m
          sleep 10
          # The test pod is deleted on success; a failed one stays for the debug step.
          helm test probe -n $ns
      - name: every node pings the other one
        if: matrix.mode == 'discovery'
        run: |
          sleep 15
          for pod in $(kubectl get pods -l app.kubernetes.io/name=urlchecker -o name); do
            pod=${pod#pod/}
            node=$(kubectl get pod "$pod" -o jsonpath='{.spec.nodeName}')
            m=$(kubectl get --raw "/api/v1/namespaces/default/pods/$pod:19376/proxy/metrics")
            echo "== $pod on $node"; echo "$m" | grep -E '^urlchecker_(target_info|icmp_requests_total|current_status)'
            echo "$m" | grep -q 'urlchecker_target_info{.*target_node=' || { echo "no discovered targets"; exit 1; }
            echo "$m" | grep -q "target_node=\"$node\"" && { echo "$pod checks its own node"; exit 1; }
            echo "$m" | grep -qE '^urlchecker_icmp_requests_total\{.*\} [1-9]' || { echo "no pings sent"; exit 1; }
          done
      - name: debug
        if: failure()
        run: |
          kubectl get pods -A -o wide
          for ns in default restricted; do kubectl -n $ns logs -l app.kubernetes.io/name=urlchecker --tail=50 --prefix || true; done

  release:
    if: startsWith(github.ref, 'refs/tags/chart-v')
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: tag matches Chart.yaml version
        run: |
          v=$(yq '.version' "$CHART/Chart.yaml")
          [ "chart-v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != chart-v$v"; exit 1; }
      - name: package, push and sign
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          helm package "$CHART" -d dist
          # helm and cosign keep separate credentials.
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          out=$(helm push dist/*.tgz "oci://$REGISTRY" 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
          cosign sign --yes "$REGISTRY/urlchecker@$digest"
