{{- include "urlchecker.validate" . }}
{{- if and (not .Values.existingConfigMap) .Values.targets }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urlchecker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlchecker.labels" . | nindent 4 }}
data:
  {{ .Values.configMapKey }}: |
    {{- range .Values.targets }}
    {{ . }}
    {{- end }}
{{- end }}
