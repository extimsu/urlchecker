{{- if and .Values.podDisruptionBudget.enabled (eq .Values.workload.kind "Deployment") }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "urlchecker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlchecker.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "urlchecker.selectorLabels" . | nindent 6 }}
{{- end }}
