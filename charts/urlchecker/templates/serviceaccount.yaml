{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urlchecker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlchecker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ or .Values.automountServiceAccountToken .Values.discovery.nodes.enabled }}
{{- end }}
