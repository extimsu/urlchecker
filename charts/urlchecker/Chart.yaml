apiVersion: v2
name: urlchecker
description: >-
  Prometheus exporter for TCP, UDP, ICMP, HTTP(S) and DNS checks. Runs as a
  Deployment for endpoint checks or as a host-network DaemonSet that finds
  every node and measures node-to-node packet loss.
type: application
version: 0.3.0
appVersion: "0.3.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/extimsu/urlchecker
sources:
  - https://github.com/extimsu/urlchecker
keywords:
  - monitoring
  - prometheus
  - exporter
  - icmp
  - packet-loss
  - blackbox
  - http
  - dns
maintainers:
  - name: Alexander Extim
    email: it@extim.su
    url: https://github.com/extimsu
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: added
      description: Kubernetes node discovery (discovery.nodes) with the RBAC it needs
    - kind: added
      description: PrometheusRule with target-down, packet-loss, certificate-expiry and reload alerts
    - kind: added
      description: HTTP(S), DNS and reload panels on the Grafana dashboard
    - kind: changed
      description: Image moved to ghcr.io/extimsu/urlchecker; probes use /healthz and /readyz
    - kind: changed
      description: Target changes no longer restart the pods; urlchecker reloads them
  artifacthub.io/images: |
    - name: urlchecker
      image: ghcr.io/extimsu/urlchecker:0.3.0
