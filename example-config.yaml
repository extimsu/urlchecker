# Example urlchecker configuration (YAML; JSON works too).
# Every key is optional. Flags given on the command line override these values.

# Targets: "host", "host:port", "tcp://host:port", "udp://host:port" or "icmp://host".
urls:
  - "example.com:443"
  - "icmp://1.1.1.1"

# Alternatively, or as well: a file with one target per line.
# file: "targets.txt"

# Defaults for targets without a protocol prefix or a port.
port: "80"
protocol: "tcp"
timeout: "5s"

# One-shot output.
json_output: false
warning_threshold: "500ms"
critical_threshold: "1s"

# Retries after a failed check (one-shot and metrics modes; the exporter never retries).
retry_count: 3
retry_delay: "1s"

# Run mode: metrics (repeat the one-shot check) or exporter (Prometheus exporter).
metrics: false
exporter: true
metrics_port: 9090
check_interval: "30s" # TCP and UDP targets
workers: 5
ping_interval: "1s" # icmp:// targets, exporter mode

# Groups: a group is healthy when all of its targets are up (urlchecker_group_health).
group_name: "" # put every target above in this group
groups:
  web:
    urls:
      - "web1.example.com:443"
      - "web2.example.com:443"
  dns:
    urls:
      - "udp://10.0.0.53:53"

# Logging to stderr.
log_level: "info" # debug, info, warn or error
log_format: "text" # text or json
